[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TRACE"
version = "0.5.2"
description = "TRACE roster editor and TRC player data synchronization for NBA 2K27"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview==6.1"]

[project.scripts]
TRACE = "trace_app.app:main"

[tool.setuptools.package-data]
trace_app = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
