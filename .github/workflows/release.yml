name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -e . -r packaging/requirements-build.txt pytest
      - name: Check release version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match pyproject.toml version'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build Windows app and updater
        run: python packaging/build_windows.py
      - name: Verify packaged app
        run: python packaging/verify_windows.py
      - name: Verify updater replacement and restart
        run: python packaging/verify_update_windows.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/*.zip dist/*.sha256 --clobber
          } else {
            if ($env:RELEASE_TAG -eq 'v0.4.0') {
              gh release create $env:RELEASE_TAG dist/*.zip dist/*.sha256 --verify-tag --prerelease --notes-file docs/releases/0.4.0.md --title "Trace 0.4.0 Beta"
            } else {
              gh release create $env:RELEASE_TAG dist/*.zip dist/*.sha256 --verify-tag --generate-notes --title "Trace $env:RELEASE_TAG"
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
