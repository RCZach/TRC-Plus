name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -e . -r packaging/requirements-build.txt pytest
      - name: Check release version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match pyproject.toml version'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build Windows app and updater
        run: python packaging/build_windows.py
      - name: Verify packaged app
        run: python packaging/verify_windows.py
      - name: Verify updater replacement and restart
        run: python packaging/verify_update_windows.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:RELEASE_TAG -in @('v0.4.0', 'v0.4.1', 'v0.5.0', 'v0.5.1')) {
              $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
              $asset = "TRACE-$($env:RELEASE_TAG.Substring(1))-windows-x64.zip"
              if ($assets -contains $asset) {
                gh release delete-asset $env:RELEASE_TAG $asset --yes
              }
              if ($assets -contains "$asset.sha256") {
                gh release delete-asset $env:RELEASE_TAG "$asset.sha256" --yes
              }
              gh release edit $env:RELEASE_TAG --title "TRACE $($env:RELEASE_TAG.Substring(1)) Beta" --notes-file "docs/releases/$($env:RELEASE_TAG.Substring(1)).md"
            }
            gh release upload $env:RELEASE_TAG dist/*.zip dist/*.sha256 --clobber
          } else {
            if ($env:RELEASE_TAG -in @('v0.4.0', 'v0.4.1', 'v0.5.0', 'v0.5.1')) {
              gh release create $env:RELEASE_TAG dist/*.zip dist/*.sha256 --verify-tag --prerelease --notes-file "docs/releases/$($env:RELEASE_TAG.Substring(1)).md" --title "TRACE $($env:RELEASE_TAG.Substring(1)) Beta"
            } else {
              gh release create $env:RELEASE_TAG dist/*.zip dist/*.sha256 --verify-tag --generate-notes --title "TRACE $env:RELEASE_TAG"
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
